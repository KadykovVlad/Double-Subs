# Accounts and sync of Double Sub. See README.md for the first deploy.
name = "double-sub-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "double-sub"
# The id printed by `wrangler d1 create double-sub` (not a secret).
database_id = "7022394a-df71-45d1-a714-7b0430015328"
migrations_dir = "migrations"

[vars]
# The extension's origin(s), comma-separated: chrome-extension://<id>. Only they get CORS answers.
# The first is the development ID (fixed by the key in wxt.config.ts); add the store's ID after the first upload.
EXTENSION_ORIGINS = "chrome-extension://kbipbdkmdaghooihkcmdjhfmeoimgnbm"

# Secrets (wrangler secret put): GOOGLE_CLIENT_ID, SESSION_SECRET.
